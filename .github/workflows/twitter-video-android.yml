name: Twitter vidéo - APK Android
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test timestamp and engagement parsing
        run: flutter test test/core/utils/date_utils_test.dart test/core/utils/engagement_utils_test.dart test/core/database/engagement_cache_test.dart test/features/cast/cast_quality_test.dart test/features/search/video_search_utils_test.dart test/core/client/twitter_account_test.dart test/features/subscriptions/subscription_handle_test.dart test/core/client/public_x_client_test.dart test/features/subscriptions/subscription_updates_test.dart test/features/feed/local_video_filter_test.dart test/core/database/retrieval_source_test.dart test/features/feed/similar_video_discovery_test.dart test/features/player/video_seek_bar_test.dart test/core/database/local_video_reactions_test.dart test/features/feed/local_recommendation_profile_test.dart test/features/feed/x_like_counter_test.dart test/features/feed/followed_hashtag_recommendations_test.dart test/features/feed/video_long_only_test.dart test/core/database/watched_video_recommendations_test.dart test/features/feed/hashtag_blacklist_test.dart test/features/feed/dislike_immediate_test.dart test/features/player/video_audio_provider_test.dart test/features/cast/cast_autoplay_queue_test.dart test/core/database/viewed_video_ids_test.dart test/features/feed/hashtag_search_fallback_test.dart test/features/update/app_update_service_test.dart test/features/diagnostics/privacy_diagnostics_test.dart test/features/feed/fresh_video_queue_test.dart test/core/database/discovery_playback_persistence_test.dart test/features/feed/feed_pagination_cursor_test.dart
      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_SIGNING_PASSWORD:-}" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64 and ANDROID_SIGNING_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/twitter-video-release.p12
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=twittervideo\nstoreFile=../twitter-video-release.p12\n' "$ANDROID_SIGNING_PASSWORD" "$ANDROID_SIGNING_PASSWORD" > android/key.properties
      - name: Build release ARM64
        run: flutter build apk --release --target-platform android-arm64 --build-name 0.33.0 --build-number 33
      - name: Name APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Twitter-video-0.33.0-arm64.apk
      - name: Publish APK checksum
        run: sha256sum Twitter-video-0.33.0-arm64.apk > Twitter-video-0.33.0-arm64.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Twitter-video-Android-ARM64
          path: |
            Twitter-video-0.33.0-arm64.apk
            Twitter-video-0.33.0-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK in GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v0.33.0
          apk=Twitter-video-0.33.0-arm64.apk
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "Twitter vidéo 0.33.0" \
              --notes "Export direct des diagnostics dans Téléchargements, purge après sauvegarde, recherche et découverte plus robustes, diagnostics techniques anonymisés."
          fi
          for asset in "$apk" "$apk.sha256"; do
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$tag" "$asset" --clobber; then
                uploaded=true
                break
              fi
              sleep 5
            done
            if [[ "$uploaded" != true ]]; then exit 1; fi
          done
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "$apk"
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "$apk.sha256"
          gh release edit "$tag" --draft=false
      - name: Clear local signing material
        if: always()
        shell: bash
        run: rm -f android/twitter-video-release.p12 android/key.properties
